# Turing Unlock Loader
# ASCII only. Firmware GOP fonts usually cannot draw CJK.
default=skip
timeout_sec=20
verbose=0
targets=all

# Experimental Ada IDs (upstream gpu-unlock-ada style). Exact IDs need the
# matching flag AND their PCI BDF in targets (never via targets=all):
#   10de:2704 RTX 4080        -> rtx4080_experimental=1, targets=<seg:bus:dev.fn>
#   10de:2702 RTX 4080 SUPER  -> ad103_experimental=1,   targets=<seg:bus:dev.fn>
#   10de:2705 AD103 canary    -> ad103_experimental=1,   targets=<seg:bus:dev.fn>
#   10de:2805 AD106           -> ad106_experimental=1,   targets=<seg:bus:dev.fn>
#   10de:2685 RTX 4090 D      -> rtx4090d_experimental=1 (targets=all ok)
rtx4080_experimental=0
ad103_experimental=0
ad106_experimental=0
rtx4090d_experimental=0

# Experimental: after Ada/Ampere selectors succeed, skip PCIe FLR and still
# chainload. Default 0. Use to isolate primary-GPU FLR reboot; unlock state is
# session-only and still lost on a real reboot.
skip_flr=0
